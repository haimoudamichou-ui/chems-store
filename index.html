<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffd21f">
<title>CHEMS STORE | شمس ستور</title>

<style>
:root {
  --yellow: #ffd21f;
  --black: #111;
  --white: #fff;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  color: var(--black);
  background: var(--white);
  overflow-x: hidden;
}
a { text-decoration: none; color: inherit; }
button, input, textarea, select { font: inherit; }

/* شاشة الترحيب الافتتاحية */
.welcome-splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--yellow);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  cursor: pointer;
  opacity: 1;
  transform: translateY(0);
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
}
.welcome-splash.is-leaving {
  opacity: 0;
  transform: translateY(-100%);
  pointer-events: none;
}
.welcome-splash.is-gone {
  display: none;
}
.splash-card {
  background: var(--black);
  color: var(--yellow);
  padding: 36px 42px;
  border: 3px solid var(--black);
  box-shadow: 12px 12px 0 var(--white);
  animation: splashPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.splash-tag {
  display: inline-block;
  background: var(--yellow);
  color: var(--black);
  font-size: 12px;
  font-weight: 900;
  padding: 5px 10px;
  margin-bottom: 14px;
}
.splash-logo {
  display: block;
  font-size: clamp(34px, 6vw, 58px);
  font-weight: 900;
  direction: ltr;
  unicode-bidi: isolate;
  letter-spacing: -2px;
  line-height: 1.05;
}
.splash-subtitle {
  display: block;
  color: var(--white);
  font-size: 16px;
  font-weight: bold;
  margin-top: 12px;
}
.splash-hint {
  display: block;
  color: #bbb;
  font-size: 12px;
  margin-top: 16px;
}

@keyframes splashPop {
  0% {
    opacity: 0;
    transform: scale(0.9) translateY(16px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.topbar {
  background: var(--black);
  color: var(--white);
  text-align: center;
  padding: 10px;
  font-size: 13px;
}
header {
  background: var(--yellow);
  padding: 22px 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 4px solid var(--black);
}
.brand h1 {
  margin: 0;
  font-size: clamp(30px, 5vw, 52px);
  font-weight: 900;
  direction: ltr;
  unicode-bidi: isolate;
  letter-spacing: -2px;
}
.brand span {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-top: 8px;
}
nav {
  display: flex;
  gap: 18px;
  align-items: center;
  font-weight: bold;
}
nav a:hover { text-decoration: underline; }

.cart-nav {
  background: var(--black);
  color: var(--yellow);
  padding: 10px 14px;
  white-space: nowrap;
  transition: transform 0.2s ease;
}
.cart-nav.is-bouncing {
  animation: cartBump 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cart-count {
  background: var(--yellow);
  color: var(--black);
  border-radius: 50%;
  padding: 2px 7px;
  margin-right: 5px;
  display: inline-block;
}

@keyframes cartBump {
  0% { transform: scale(1); }
  45% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

.hero {
  background: var(--yellow);
  padding: 55px 7% 65px;
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  align-items: center;
  gap: 30px;
}
.eyebrow {
  display: inline-block;
  background: var(--black);
  color: var(--yellow);
  padding: 8px 14px;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 15px;
}
.hero h2 {
  font-size: clamp(34px, 5vw, 60px);
  line-height: 1.15;
  margin: 0 0 15px;
  font-weight: 900;
}
.hero p {
  font-size: 17px;
  line-height: 1.8;
  margin: 0 0 25px;
}
.hero-button {
  display: inline-block;
  background: var(--black);
  color: var(--white);
  padding: 15px 25px;
  font-weight: bold;
  border: 2px solid var(--black);
}
.hero-button:hover {
  background: var(--white);
  color: var(--black);
}
.hero-art {
  background: var(--black);
  color: var(--yellow);
  min-height: 230px;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 25px;
  transform: rotate(2deg);
  box-shadow: 12px 12px 0 var(--white);
}
.hero-art strong {
  display: block;
  font-size: clamp(35px, 5vw, 60px);
  direction: ltr;
  unicode-bidi: isolate;
  letter-spacing: -2px;
}
.hero-art span {
  display: block;
  color: var(--white);
  font-weight: bold;
  margin-top: 12px;
}

.section { padding: 65px 7%; }
.section-heading { margin-bottom: 30px; }
.section-heading h2 {
  font-size: clamp(27px, 4vw, 38px);
  margin: 0;
  font-weight: 900;
}
.section-heading p { color: #666; }
.yellow-line {
  width: 65px;
  height: 6px;
  background: var(--yellow);
  margin-top: 12px;
}

.products {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}
.product {
  border: 2px solid #eee;
  background: var(--white);
  transition: .25s;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.product:hover {
  border-color: var(--yellow);
  transform: translateY(-6px);
  box-shadow: 0 12px 25px #00000012;
}
.product-image {
  background: #f5f5f5;
  aspect-ratio: 1 / 1;
  overflow: hidden;
}
.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}
.product:hover .product-image img {
  transform: scale(1.03);
}
.product-info {
  padding: 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.product-info h3 {
  margin: 0 0 10px;
  font-size: 18px;
  min-height: 44px;
}
.price {
  font-size: 21px;
  font-weight: 900;
  margin-bottom: 15px;
  margin-top: auto;
}
.price small { font-size: 13px; color: #666; }

.order-button {
  position: relative;
  border: 2px solid var(--black);
  background: var(--yellow);
  color: var(--black);
  padding: 12px;
  width: 100%;
  font-weight: 900;
  cursor: pointer;
  transition: transform 0.16s ease, background-color 0.16s ease, color 0.16s ease;
}
.order-button:hover {
  background: var(--black);
  color: var(--yellow);
}
.order-button.is-adding {
  transform: scale(0.95);
  background: var(--black);
  color: var(--yellow);
  animation: addPop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes addPop {
  0% { transform: scale(0.94); }
  55% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

.plus-float {
  position: fixed;
  z-index: 950;
  pointer-events: none;
  background: var(--black);
  color: var(--yellow);
  font-weight: 900;
  font-size: 14px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 2px solid var(--yellow);
  transform: translate(-50%, -50%);
  animation: floatUpFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes floatUpFade {
  0% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.85);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, calc(-50% - 48px)) scale(1.1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .welcome-splash,
  .splash-card,
  .cart-nav.is-bouncing,
  .order-button.is-adding,
  .plus-float {
    animation: none !important;
    transition: none !important;
  }
}

/* سلة المشتريات */
.cart-section {
  background: #f7f7f7;
  padding: 55px 7%;
}
.cart-section h2 {
  font-size: 30px;
  margin-top: 0;
}
.cart-item {
  background: var(--white);
  border: 1px solid #ddd;
  padding: 15px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
}
.cart-item h3 {
  margin: 0 0 7px;
  font-size: 17px;
}
.cart-item p {
  margin: 0;
  color: #666;
  font-size: 14px;
}
.quantity-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.quantity-controls button {
  width: 32px;
  height: 32px;
  border: 0;
  background: var(--yellow);
  font-weight: bold;
  cursor: pointer;
  font-size: 18px;
}
.quantity-controls span {
  font-weight: bold;
  min-width: 20px;
  text-align: center;
}
.remove-button {
  background: #eee !important;
  color: #b00020;
  font-size: 14px !important;
  width: auto !important;
  padding: 0 10px;
}
.cart-summary {
  background: var(--black);
  color: var(--white);
  padding: 22px;
  margin-top: 20px;
}
.cart-summary p {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  margin: 8px 0;
}
.cart-summary .total {
  color: var(--yellow);
  font-size: 23px;
  font-weight: 900;
  border-top: 1px solid #555;
  padding-top: 15px;
  margin-top: 15px;
}
.checkout-button {
  width: 100%;
  padding: 15px;
  background: var(--yellow);
  color: var(--black);
  border: 0;
  font-weight: 900;
  cursor: pointer;
  margin-top: 15px;
}
.checkout-button:hover { background: var(--white); }
.empty-cart {
  background: var(--white);
  padding: 25px;
  text-align: center;
  color: #777;
  border: 1px dashed #ccc;
}

.features {
  background: var(--black);
  color: var(--white);
  padding: 35px 7%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  text-align: center;
}
.feature strong {
  display: block;
  color: var(--yellow);
  font-size: 18px;
  margin-bottom: 8px;
}
.feature span { color: #ddd; font-size: 14px; }

footer {
  background: var(--yellow);
  padding: 30px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  font-weight: bold;
}
footer strong {
  direction: ltr;
  unicode-bidi: isolate;
  font-size: 23px;
}
.instagram-link {
  background: var(--black);
  color: var(--white);
  padding: 12px 18px;
  display: inline-block;
}

/* نافذة الطلب */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0, 0, 0, 0.7);
  padding: 18px;
  align-items: center;
  justify-content: center;
}
.modal.show { display: flex; }
.modal-box {
  background: var(--white);
  width: 100%;
  max-width: 480px;
  padding: 25px;
  border-top: 7px solid var(--yellow);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
.close {
  position: absolute;
  left: 15px;
  top: 12px;
  border: 0;
  background: transparent;
  font-size: 28px;
  cursor: pointer;
}
.modal-box h2 { margin: 5px 0 8px; }
.modal-box > p { color: #666; font-size: 14px; }
.chosen-product {
  background: #fff7d6;
  padding: 12px;
  font-weight: bold;
  margin: 18px 0;
  line-height: 1.8;
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
  font-size: 14px;
}
.field input, .field select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  outline: none;
  direction: rtl;
  background: var(--white);
}
.field input:focus, .field select:focus {
  border-color: var(--yellow);
  box-shadow: 0 0 0 2px var(--yellow);
}
.submit-button, .copy-button {
  width: 100%;
  padding: 14px;
  border: 0;
  background: var(--yellow);
  color: var(--black);
  font-weight: 900;
  cursor: pointer;
}
.copy-button {
  background: var(--black);
  color: var(--white);
  margin-bottom: 12px;
}
.order-message {
  width: 100%;
  min-height: 190px;
  padding: 12px;
  direction: rtl;
  text-align: right;
  border: 1px solid #ccc;
  resize: vertical;
  line-height: 1.7;
  margin: 12px 0;
}
.result-actions { margin-top: 15px; }
.result-actions a {
  display: block;
  text-align: center;
  padding: 14px;
  font-weight: bold;
}
.instagram-action {
  background: var(--yellow);
  color: var(--black);
}
.note {
  font-size: 12px;
  color: #777;
  line-height: 1.6;
  margin-top: 12px;
}

@media(max-width:850px) {
  .products { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: 1fr; }
  .hero-art { min-height: 170px; }
}

  header {
    padding: 18px 5%;
    flex-direction: column;

  nav {
    gap:
