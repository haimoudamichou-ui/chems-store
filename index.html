<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHEMS STORE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      font-size: 32px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 10px;
      color: #ccc;
    }

    .products {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 22px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      padding-bottom: 20px;
    }

    .product img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .product h2 {
      font-size: 19px;
      margin: 17px 10px 10px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 17px;
      color: #222;
    }

    .order {
      display: inline-block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 11px 25px;
      border-radius: 7px;
      font-weight: bold;
    }

    .order:hover {
      background: #444;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 10px;
      margin-top: 25px;
    }

    footer a {
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>CHEMS STORE</h1>
    <p>مرحبا بكم في متجرنا</p>
  </header>

  <main class="products">

    <div class="product">
      <img src="67098287-29f6-4181-8c3d-e46261d2d004.jpg"
           alt="حاملة المفاتيح">
      <h2>حاملة المفاتيح الخشبية</h2>
      <p class="price">1500 دج</p>
      <a class="order" href="https://www.instagram.com/chem.sstore/" target="_blank">اطلب الآن</a>
    </div>

    <div class="product">
      <img src="9af27dc2-cc53-4f0e-9e6c-afce0af1eb29.jpg"
           alt="بورت كلي باللوغو">
      <h2>بورت كلي مخصص باللوغو</h2>
      <p class="price">500 دج</p>
      <a class="order" href="https://www.instagram.com/chem.sstore/" target="_blank">اطلب الآن</a>
    </div>

    <div class="product">
      <img src="b72ff17d-d492-4a95-9eae-c68112010b7c.jpg"
           alt="بورت كلي عادي">
      <h2>بورت كلي خشبي</h2>
      <p class="price">500 دج</p>
      <a class="order" href="https://www.instagram.com/chem.sstore/" target="_blank">اطلب الآن</a>
    </div>

    <div class="product">
      <img src="f85238ca-2e4a-4c53-8749-4ddc3134fea4.jpg"
           alt="حصالة تحدي 50 مليون">
      <h2>حصالة تحدي 50 مليون</h2>
      <p class="price">2000 دج</p>
      <a class="order" href="https://www.instagram.com/chem.sstore/" target="_blank">اطلب الآن</a>
    </div>

  </main>

  <footer>
    <p>CHEMS STORE © 2026</p>
    <p>تابعونا على Instagram</p>
    <a href="https://www.instagram.com/chem.sstore/" target="_blank">
      @chem.sstore
    </a>
  </footer>

</body>
</html>
